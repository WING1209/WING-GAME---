<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>パズル対戦ゲーム</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>
    <div id="game-container">
        <!-- ゲーム描画用キャンバス (360x640固定解像度) -->
        <canvas id="gameCanvas" width="360" height="640"></canvas>

        <!-- 1. タイトル画面 -->
        <div id="screen-title" class="overlay-screen">
            <h1 class="main-logo">パズル対戦</h1>
            <button onclick="selectMainMenu('host')">部屋を作る (ホスト)</button>
            <button onclick="selectMainMenu('guest')">部屋に入る (ゲスト)</button>
        </div>

        <!-- 2. ホスト設定画面 -->
        <div id="screen-host-config" class="overlay-screen" style="display:none;">
            <h2>対戦設定</h2>
            <div class="menu-box">
                <label>人数: 
                    <select id="select-max-players">
                        <option value="2">2人</option>
                        <option value="3">3人</option>
                        <option value="4">4人</option>
                        <option value="5">5人</option>
                    </select>
                </label>
                <label>勝利数: 
                    <select id="select-target-wins">
                        <option value="1">1本先取</option>
                        <option value="2">2本先取</option>
                        <option value="3">3本先取</option>
                    </select>
                </label>
                <label>お邪魔倍率: 
                    <select id="select-ojama-mult">
                        <option value="1">1倍</option>
                        <option value="2">2倍</option>
                    </select>
                </label>
            </div>
            <button onclick="confirmHostSettings()">部屋作成</button>
        </div>

        <!-- 3. ホスト部屋待機画面 -->
        <div id="screen-host-wait" class="overlay-screen" style="display:none;">
            <h2>部屋コード: <span id="display-room-code">----</span></h2>
            <p id="host-wait-status">サーバー接続中...</p>
        </div>

        <!-- 4. ゲスト部屋参加画面 -->
        <div id="screen-guest-join" class="overlay-screen" style="display:none;">
            <h2>部屋コード入力</h2>
            <input type="number" id="input-room-code" placeholder="4桁の数字">
            <button onclick="joinRoom()">参加</button>
            <p id="guest-status-msg"></p>
        </div>

        <!-- 5. プレイヤー名前入力画面 -->
        <div id="screen-name-input" class="overlay-screen" style="display:none;">
            <h2>名前入力</h2>
            <input type="text" id="input-player-name" maxlength="6" placeholder="名前 (6文字まで)">
            <button onclick="submitPlayerName()">完了</button>
            <p id="name-wait-msg"></p>
        </div>

        <!-- 6. 順番決めルーレット画面 -->
        <div id="screen-roulette" class="overlay-screen" style="display:none;">
            <h2>順番決めルーレット</h2>
            <div id="roulette-display" style="font-size: 56px; font-weight: bold; margin: 20px; color:#ffcc00;">1</div>
            <p id="my-order-result" style="font-size: 18px; height: 24px;"></p>
            <button id="btn-roulette-action" onclick="handleRouletteTap()">ストップ</button>
        </div>

        <!-- 7. ゲームプレイ用UI (アイテムボタン等) -->
        <div id="game-ui" style="display:none; position:absolute; bottom:5px; right:5px; z-index:10;">
            <button onclick="useItemOshitsuke()" style="padding:4px 8px; font-size:11px;">押し付け</button>
            <button onclick="useItemForceShoot()" style="padding:4px 8px; font-size:11px;">強制発射</button>
            <button onclick="useItemDefense()" style="padding:4px 8px; font-size:11px;">ガード</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
