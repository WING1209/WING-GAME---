<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>〇WINGパズル対戦〇</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; color: #fff; }

        /* 点滅アニメーション */
        .blink { animation: blinker 1.2s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        /* 画面振動 */
        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            50% { transform: translate(-1px, 2px) rotate(1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* 画面切替 */
        .screen { display: none; width: 100vw; height: 100vh; flex-direction: column; justify-content: center; align-items: center; position: absolute; top:0; left:0; }
        .active { display: flex; }

        /* タイトル・メニュー */
        #title-screen h1 { font-size: 2rem; color: #00ffff; text-shadow: 0 0 10px #00ffff; text-align: center; }
        .btn { background: #333; border: 2px solid #00ffff; color: #fff; padding: 12px 20px; margin: 8px; font-size: 1.1rem; border-radius: 8px; width: 220px; text-align: center; }
        .btn:active { background: #00ffff; color: #000; }
        input[type="text"] { font-size: 1.2rem; padding: 10px; text-align: center; margin: 10px; border-radius: 8px; border: none; width: 80%; }

        /* ゲーム画面 (7:3 分割) */
        #game-screen { flex-direction: row; }
        #gui-panel { width: 30vw; height: 100vh; background: #222; border-right: 2px solid #444; display: flex; flex-direction: column; justify-content: space-around; padding: 5px; font-size: 0.75rem; }
        #canvas-panel { width: 70vw; height: 100vh; position: relative; }
        canvas { width: 100%; height: 100%; background: #000; display: block; }

        /* UI アイテムリスト (1行1列表示) */
        .item-row { background: #333; margin: 3px 0; padding: 6px 2px; border-radius: 4px; text-align: center; border: 1px solid #555; }
        
        /* オーバーレイ */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        .big-text { font-size: 3.5rem; color: #ff0; text-shadow: 0 0 20px #ff0; }
    </style>
</head>
<body>

    <!-- タイトル画面 -->
    <div id="title-screen" class="screen active" onclick="switchScreen('menu-screen')">
        <h1>〇WINGパズル対戦〇</h1>
        <div class="blink" style="margin-top: 40px;">画面タップでスタート</div>
    </div>

    <!-- メニュー画面 -->
    <div id="menu-screen" class="screen">
        <div class="btn" onclick="selectHost()">① ホスト</div>
        <div class="btn" onclick="selectGuest()">② ゲスト</div>
        <div class="btn" onclick="location.reload()">③ EXIT</div>
    </div>

    <!-- ホスト：人数選択 -->
    <div id="host-count-screen" class="screen">
        <h3>対戦人数を選択 (2〜5名)</h3>
        <div style="display:flex;">
            <div class="btn" style="width:45px;" onclick="setPlayerCount(2)">2</div>
            <div class="btn" style="width:45px;" onclick="setPlayerCount(3)">3</div>
            <div class="btn" style="width:45px;" onclick="setPlayerCount(4)">4</div>
            <div class="btn" style="width:45px;" onclick="setPlayerCount(5)">5</div>
        </div>
    </div>

    <!-- 名前入力画面 -->
    <div id="name-screen" class="screen">
        <h3>名前を入力 (全角6文字)</h3>
        <input type="text" id="player-name-input" maxlength="6" placeholder="なまえ">
        <div class="btn" onclick="submitName()">決定</div>
    </div>

    <!-- ゲスト：コード入力 -->
    <div id="guest-code-screen" class="screen">
        <h3>4桁のRoom Noを入力</h3>
        <input type="text" id="room-code-input" maxlength="4" placeholder="1234">
        <div class="btn" onclick="switchScreen('name-screen')">次へ</div>
    </div>

    <!-- 待機画面 -->
    <div id="lobby-screen" class="screen">
        <h2>ROOM: <span id="display-code" style="color:#00ffff;">----</span></h2>
        <div class="blink" style="margin: 20px;">参加者を待ち待機中...</div>
        <div id="start-btn" class="btn" onclick="startRoulette()">ゲーム開始</div>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="screen">
        <div id="gui-panel">
            <div>
                <div>NAME:</div>
                <div id="gui-name" style="color:#00ffff; font-weight:bold;">-</div>
            </div>
            <div>
                <div>ターン制限:</div>
                <div id="gui-timer" style="color:#ff0; font-size:1.2rem;">10</div>
            </div>
            <div>
                <div>消した玉:</div>
                <div id="gui-score" style="color:#ff0;">0/500</div>
            </div>
            <div>
                <div>NEXT:</div>
                <div id="gui-next" style="width:20px; height:20px; border-radius:50%; background:#fff; margin:2px auto;"></div>
            </div>
            <!-- アイテム1行1列表示 -->
            <div id="item-list">
                <div class="item-row">2倍</div>
                <div class="item-row">3倍</div>
                <div class="item-row">スキップ</div>
                <div class="item-row">貫通</div>
                <div class="item-row">色変更</div>
                <div class="item-row">ミステリー</div>
            </div>
        </div>

        <div id="canvas-panel">
            <canvas id="gameCanvas"></canvas>
            <div id="overlay" class="overlay">
                <div id="overlay-text" class="big-text"></div>
                <div id="overlay-btn" class="btn" style="display:none; margin-top:20px;">STOP</div>
            </div>
        </div>
    </div>

    <script>
        let maxPlayers = 2;
        let myName = "";
        let roomCode = "1234";

        // 全角変換・自動切り出し
        document.getElementById('player-name-input').addEventListener('input', function(e) {
            let val = e.target.value.replace(/[A-Za-z0-9]/g, s => String.fromCharCode(s.charCodeAt(0) + 0xFEE0));
            e.target.value = val.slice(0, 6);
        });

        function switchScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function selectHost() { switchScreen('host-count-screen'); }
        function selectGuest() { switchScreen('guest-code-screen'); }

        function setPlayerCount(cnt) {
            maxPlayers = cnt;
            switchScreen('name-screen');
        }

        function submitName() {
            myName = document.getElementById('player-name-input').value || "ゲスト";
            document.getElementById('gui-name').innerText = myName;
            roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('display-code').innerText = roomCode;
            switchScreen('lobby-screen');
        }

        function startRoulette() {
            switchScreen('game-screen');
            initCanvas();
            
            const overlay = document.getElementById('overlay');
            const text = document.getElementById('overlay-text');
            const btn = document.getElementById('overlay-btn');
            overlay.style.display = 'flex';
            btn.style.display = 'block';

            let count = 1;
            let timer = setInterval(() => {
                text.innerText = count;
                count = (count % maxPlayers) + 1;
            }, 80);

            btn.onclick = () => {
                clearInterval(timer);
                btn.style.display = 'none';
                document.body.classList.add('shake');
                setTimeout(() => {
                    document.body.classList.remove('shake');
                    text.classList.add('blink');
                    setTimeout(() => {
                        text.classList.remove('blink');
                        overlay.style.display = 'none';
                        startTurnTimer();
                    }, 1000);
                }, 400);
            };
        }

        // カウントダウンタイマー (10秒)
        let turnTime = 10;
        let timerInterval;
        function startTurnTimer() {
            turnTime = 10;
            document.getElementById('gui-timer').innerText = turnTime;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                turnTime--;
                document.getElementById('gui-timer').innerText = turnTime;
                if(turnTime <= 0) {
                    clearInterval(timerInterval);
                    alert("ターン終了！");
                }
            }, 1000);
        }

        // Canvas パズル描画
        let canvas, ctx;
        const COLORS = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff'];
        let board = [], currentBall, nextColor;

        function initCanvas() {
            canvas = document.getElementById('gameCanvas');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            ctx = canvas.getContext('2d');
            
            let r = canvas.width / 10;
            for(let row=0; row<2; row++) {
                for(let col=0; col<5; col++) {
                    board.push({ x: col*(r*2)+r, y: row*(r*2)+r, color: COLORS[Math.floor(Math.random()*COLORS.length)], radius: r });
                }
            }
            nextColor = COLORS[Math.floor(Math.random()*COLORS.length)];
            spawnBall();
            requestAnimationFrame(draw);
        }

        function spawnBall() {
            let r = canvas.width / 10;
            let isRainbow = Math.random() < 0.2;
            currentBall = { x: canvas.width/2, y: canvas.height - r*2, color: isRainbow ? '#fff' : nextColor, radius: r };
            nextColor = COLORS[Math.floor(Math.random()*COLORS.length)];
            document.getElementById('gui-next').style.background = nextColor;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 限界ライン (横点線)
            ctx.beginPath();
            ctx.setLineDash([4, 4]);
            ctx.moveTo(0, canvas.height * 0.25);
            ctx.lineTo(canvas.width, canvas.height * 0.25);
            ctx.strokeStyle = "red";
            ctx.stroke();
            ctx.setLineDash([]);

            // 玉の描画
            board.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
                ctx.fillStyle = b.color;
                ctx.fill();
            });

            if(currentBall) {
                ctx.beginPath();
                ctx.arc(currentBall.x, currentBall.y, currentBall.radius, 0, Math.PI*2);
                ctx.fillStyle = currentBall.color;
                ctx.fill();
            }

            requestAnimationFrame(draw);
        }
    </script>
</body>
</html>
