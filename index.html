<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WING★GAME玉</title>
<!-- PeerJS (通信用ライブラリ) -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
* {
    box-sizing: border-box;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
}
body {
    margin: 0;
    padding: 0;
    background: #111;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    touch-action: none;
}
#game-container {
    position: relative;
    width: 100vw;
    height: 100dvh;
    max-width: 480px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
}
canvas {
    background: #1a1a1a;
    box-shadow: 0 0 15px rgba(0,0,0,0.8);
    display: block;
    width: 360px;
    height: 100%;
    object-fit: contain;
    z-index: 1;
    touch-action: none;
}
/* 右側GUIパネル */
#right-gui {
    width: 120px;
    height: 100%;
    background: #222;
    border-left: 2px solid #444;
    display: flex;
    flex-direction: column;
    padding: 10px 5px;
    box-sizing: border-box;
    z-index: 10;
    overflow-y: auto;
}
.gui-player-info {
    background: #333;
    border: 1px solid #ffcc00;
    border-radius: 8px;
    padding: 6px 4px;
    text-align: center;
    margin-bottom: 10px;
}
.gui-player-name {
    font-size: 16px;
    font-weight: bold;
    color: #ffcc00;
    word-break: break-all;
}
.gui-section-title {
    font-size: 11px;
    color: #aaa;
    margin-top: 5px;
    margin-bottom: 3px;
    text-align: center;
}
.item-btn {
    background: #444;
    color: #fff;
    border: 1px solid #666;
    border-radius: 6px;
    padding: 8px 2px;
    margin-bottom: 6px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    text-align: center;
}
.item-btn:active {
    background: #666;
}
.item-btn:disabled {
    background: #222;
    color: #555;
    border-color: #333;
}

.overlay-screen {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(17, 17, 17, 0.95);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 100;
    text-align: center;
}
.overlay-screen h2 {
    color: #ffcc00;
    font-size: 24px;
    margin-bottom: 15px;
}
.menu-btn {
    background: #ff9800;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 16px;
    font-weight: bold;
    margin: 8px 0;
    width: 80%;
    max-width: 260px;
    cursor: pointer;
}
.menu-btn.sub {
    background: #2196F3;
}
.menu-btn.gray {
    background: #555;
}
.menu-btn:active {
    opacity: 0.8;
}
input[type="text"], select {
    width: 80%;
    max-width: 260px;
    padding: 10px;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #555;
    background: #222;
    color: #fff;
    text-align: center;
    margin-bottom: 12px;
}
/* 大型お知らせテロップ */
#big-announcement {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 32px;
    font-weight: 900;
    color: #ff3366;
    text-shadow: 0 0 10px #000, 0 0 20px #fff;
    pointer-events: none;
    z-index: 200;
    display: none;
    text-align: center;
    width: 100%;
}
</style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="360" height="640"></canvas>

    <!-- 右側GUIパネル -->
    <div id="right-gui">
        <div class="gui-player-info">
            <div style="font-size: 10px; color: #ccc;">PLAYER</div>
            <div id="gui-my-name" class="gui-player-name">---</div>
        </div>
        <div class="gui-section-title">特殊アイテム</div>
        <button id="btn-item-oshitsuke" class="item-btn" onclick="useSpecialItem('oshitsuke')">おしつけ<br><span id="count-oshitsuke">(1)</span></button>
        <button id="btn-item-hassha" class="item-btn" onclick="useSpecialItem('hassha')">発射<br><span id="count-hassha">(1)</span></button>
        <button id="btn-item-bougyo" class="item-btn" onclick="useSpecialItem('bougyo')">防御<br><span id="count-bougyo">(1)</span></button>
    </div>

    <!-- タイトル画面（①ホスト・ゲスト・終了） -->
    <div id="screen-title" class="overlay-screen" style="display: flex;">
        <h1 class="title-logo">WING GAME玉</h1>
        <button class="menu-btn" onclick="selectRole('host')">ホスト</button>
        <button class="menu-btn sub" onclick="selectRole('guest')">ゲスト</button>
        <button class="menu-btn gray" onclick="exitGame()">終了</button>
    </div>

    <!-- ホスト設定①：人数設定 -->
    <div id="screen-host-count" class="overlay-screen">
        <h2>対戦人数の選択</h2>
        <p>プレイヤー人数を選んでください (2〜5人)</p>
        <select id="select-player-count">
            <option value="2">2人対戦</option>
            <option value="3">3人対戦</option>
            <option value="4">4人対戦</option>
            <option value="5">5人対戦</option>
        </select>
        <button class="menu-btn" onclick="confirmHostCount()">次へ</button>
    </div>

    <!-- ホスト設定②：ID表示 & 勝利条件選択 -->
    <div id="screen-host-rules" class="overlay-screen">
        <h2>部屋設定</h2>
        <p>部屋ID (全員共有):</p>
        <h1 id="display-room-code" style="color:#ffcc00; font-size:36px; margin:10px 0;">----</h1>
        <p>勝利条件:</p>
        <button id="btn-win-1" class="menu-btn" onclick="setHostTargetWins(1)">先に1勝</button>
        <button id="btn-win-2" class="menu-btn gray" onclick="setHostTargetWins(2)">先に2勝</button>
        <br><br>
        <button class="menu-btn sub" onclick="confirmHostRules()">接続待ちへ</button>
    </div>

    <!-- ゲスト設定：ID入力 -->
    <div id="screen-guest-join" class="overlay-screen">
        <h2>部屋に参加</h2>
        <p>ホストが表示している4桁のIDを入力してください</p>
        <input type="text" id="input-room-code" maxlength="4" placeholder="4桁の数字">
        <button class="menu-btn" onclick="joinRoom()">接続</button>
        <p id="status-message" style="color:#ff4d4d; font-size:14px;"></p>
    </div>

    <!-- 接続待ち（ホスト・ゲスト共通） -->
    <div id="screen-wait-players" class="overlay-screen">
        <h2>プレイヤー接続待ち</h2>
        <p id="wait-player-status">接続中: 1 / 2 人</p>
        <div id="player-list-display" style="text-align:left; font-size:14px; color:#aaa; margin:10px 0;"></div>
    </div>

    <!-- ② プレイヤー名入力画面 -->
    <div id="screen-name-input" class="overlay-screen">
        <h2>プレイヤー名入力</h2>
        <p>名前を入力してください<br>(全角6文字まで)</p>
        <input type="text" id="input-player-name" maxlength="6" placeholder="名前を入力">
        <button class="menu-btn" onclick="submitPlayerName()">決定</button>
        <p id="name-wait-status" style="color:#aaa; font-size:14px; margin-top:10px;"></p>
    </div>

    <!-- ② 順番決めルーレット画面 -->
    <div id="screen-roulette-turn" class="overlay-screen">
        <h2>順番決定ルーレット</h2>
        <h1 id="roulette-status-text" style="color:#ffcc00; font-size:28px; margin:20px 0;">ルーレットスタート！</h1>
        <button id="btn-roulette-action" class="menu-btn" onclick="handleTurnRouletteClick()">タップして停止</button>
    </div>

    <!-- ② 準備完了確認画面 -->
    <div id="screen-ready-confirm" class="overlay-screen">
        <h2>対戦準備</h2>
        <p id="my-turn-order-desc" style="font-size:18px; color:#4da6ff;"></p>
        <button id="btn-ready-start" class="menu-btn" onclick="sendReadySignal()">準備開始</button>
        <p id="ready-wait-status" style="color:#aaa; font-size:14px; margin-top:10px;"></p>
    </div>

    <!-- ターゲット選択ダイアログ (おしつけ / 発射 用) -->
    <div id="screen-target-select" class="overlay-screen" style="background: rgba(0,0,0,0.85);">
        <h2>対象プレイヤーを選択</h2>
        <div id="target-player-buttons" style="display:flex; flex-direction:column; align-items:center; width:100%;"></div>
        <button class="menu-btn gray" onclick="closeTargetSelect()">キャンセル</button>
    </div>

    <!-- 大型演出テキスト -->
    <div id="big-announcement"></div>
</div>

<script src="script.js"></script>
</body>
</html>
