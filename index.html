<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CYBER SPHERE☆BATTLE</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: #05050a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 480px; /* 右側GUI領域を考慮して幅を最適調整 */
            max-height: 932px;
            background: radial-gradient(circle at center, #101428 0%, #05050a 100%);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: row; /* ゲーム盤面と右側GUIのレイアウト */
        }

        /* 左側：ゲーム描画エリア */
        #canvas-wrapper {
            position: relative;
            width: 330px;
            height: 100%;
            background-color: #0d111e;
        }

        #gameCanvas {
            width: 330px;
            height: 100%;
            display: block;
        }

        /* 右側：ゲームUI / GUIパネル */
        #side-gui {
            flex: 1;
            background: rgba(15, 23, 42, 0.95);
            border-left: 2px solid rgba(0, 243, 255, 0.3);
            display: flex;
            flex-direction: column;
            padding: 8px 6px;
            gap: 8px;
            z-index: 20;
            overflow-y: auto;
        }

        .player-info-card {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid #00f3ff;
            border-radius: 8px;
            padding: 6px;
            text-align: center;
        }

        .player-name-title {
            font-size: 14px;
            font-weight: 900;
            color: #00f3ff;
            text-shadow: 0 0 5px #00f3ff;
            word-break: break-all;
        }

        .score-display {
            font-size: 11px;
            color: #ffe600;
            margin-top: 2px;
            font-weight: bold;
        }

        /* アイテムリスト */
        .item-section-title {
            font-size: 10px;
            color: #888;
            letter-spacing: 1px;
            text-align: center;
            margin-top: 4px;
        }

        .item-grid {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .btn-item-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.4);
            border-radius: 6px;
            padding: 6px 4px;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .btn-item-card:active {
            background: #00f3ff;
            color: #000;
        }

        .btn-item-card.disabled {
            opacity: 0.3;
            pointer-events: none;
            border-color: #444;
        }

        .item-count {
            background: #ff0055;
            color: #fff;
            border-radius: 10px;
            padding: 1px 5px;
            font-size: 9px;
        }

        /* UIオーバーレイ画面 */
        .overlay-screen {
            position: absolute;
            inset: 0;
            background: rgba(5, 5, 10, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            gap: 16px;
            z-index: 100;
        }

        .main-title-container { text-align: center; }
        .sub-title { font-size: 11px; letter-spacing: 3px; color: #00f3ff; font-weight: 700; }
        .main-logo {
            font-size: 32px;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(135deg, #00f3ff, #ff0055);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .menu-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        label { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #d0d5e0; }
        input, select { padding: 8px 10px; font-size: 14px; border-radius: 8px; border: 1px solid rgba(0, 243, 255, 0.3); background-color: rgba(15, 20, 35, 0.8); color: #00f3ff; text-align: center; }

        .btn-action {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 800;
            color: #05050a;
            background: linear-gradient(90deg, #00f3ff, #00aaff);
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .btn-secondary { background: transparent; border: 1px solid rgba(255, 255, 255, 0.2); color: #aaa; }
        .status-badge { font-size: 12px; color: #ff0055; font-weight: bold; }

        /* ダイアログ（色替え・対象選択等） */
        .modal-dialog {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0f172a;
            border: 2px solid #00f3ff;
            border-radius: 12px;
            padding: 16px;
            z-index: 300;
            width: 85%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .color-selector-box {
            display: flex;
            justify-content: space-around;
            margin: 8px 0;
        }

        .color-dot {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #fff;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 左側：メインゲーム画面 -->
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="330" height="640"></canvas>
        </div>

        <!-- 右側：GUIパネル -->
        <div id="side-gui" style="display:none;">
            <div class="player-info-card">
                <div class="sub-title">PLAYER</div>
                <div id="gui-player-name" class="player-name-title">---</div>
                <div class="score-display">消去数: <span id="gui-cleared-count">0</span> / 500</div>
            </div>

            <div class="item-section-title">ITEMS</div>
            <div class="item-grid">
                <button id="btn-item-double" class="btn-item-card" onclick="useItem('double')">お邪魔2倍 <span id="cnt-double" class="item-count">0</span></button>
                <button id="btn-item-triple" class="btn-item-card" onclick="useItem('triple')">お邪魔3倍 <span id="cnt-triple" class="item-count">0</span></button>
                <button id="btn-item-skip" class="btn-item-card" onclick="useItem('skip')">スキップ <span id="cnt-skip" class="item-count">0</span></button>
                <button id="btn-item-pierce" class="btn-item-card" onclick="useItem('pierce')">貫通 <span id="cnt-pierce" class="item-count">0</span></button>
                <button id="btn-item-color" class="btn-item-card" onclick="useItem('color')">色替え <span id="cnt-color" class="item-count">0</span></button>
                <button id="btn-item-redirect" class="btn-item-card" onclick="useItem('redirect')">おしつけ <span id="cnt-redirect" class="item-count">0</span></button>
                <button id="btn-item-forceshoot" class="btn-item-card" onclick="useItem('forceshoot')">発射 <span id="cnt-forceshoot" class="item-count">0</span></button>
                <button id="btn-item-defense" class="btn-item-card" onclick="useItem('defense')">防御 <span id="cnt-defense" class="item-count">0</span></button>
            </div>
        </div>

        <!-- 1. タイトル画面 -->
        <div id="screen-title" class="overlay-screen">
            <div class="main-title-container">
                <div class="sub-title">REAL-TIME MULTI PUZZLE</div>
                <div class="main-logo">CYBER SPHERE</div>
            </div>
            <button class="btn-action" onclick="selectMainMenu('host')">部屋を作る (HOST)</button>
            <button class="btn-action btn-secondary" onclick="selectMainMenu('guest')">部屋に入る (GUEST)</button>
        </div>

        <!-- 2. ホスト設定画面 -->
        <div id="screen-host-config" class="overlay-screen" style="display:none;">
            <h2 style="color:#00f3ff;">MATCH CONFIG</h2>
            <div class="menu-box">
                <label>対戦人数
                    <select id="select-max-players">
                        <option value="2">2 Players</option>
                        <option value="3">3 Players</option>
                        <option value="4">4 Players</option>
                    </select>
                </label>
                <label>先取数
                    <select id="select-target-wins">
                        <option value="1">1 WIN</option>
                        <option value="2">2 WINS</option>
                    </select>
                </label>
                <label>お邪魔倍率
                    <select id="select-ojama-mult">
                        <option value="1">1.0x</option>
                        <option value="2">2.0x</option>
                    </select>
                </label>
            </div>
            <button class="btn-action" onclick="confirmHostSettings()">ルーム作成</button>
        </div>

        <!-- 3. ホスト待機画面 -->
        <div id="screen-host-wait" class="overlay-screen" style="display:none;">
            <div class="sub-title">ROOM CODE</div>
            <div id="display-room-code" style="font-size: 48px; font-weight: 900; color: #00f3ff;">----</div>
            <div id="host-wait-status" class="status-badge">CONNECTING...</div>
        </div>

        <!-- 4. ゲスト部屋参加画面 -->
        <div id="screen-guest-join" class="overlay-screen" style="display:none;">
            <h2 style="color:#00f3ff;">ENTER CODE</h2>
            <input type="number" id="input-room-code" placeholder="4桁のコード" style="font-size: 24px; width: 80%;">
            <button class="btn-action" onclick="joinRoom()">接続する</button>
            <p id="guest-status-msg" class="status-badge"></p>
        </div>

        <!-- 5. プレイヤー名前入力画面 -->
        <div id="screen-name-input" class="overlay-screen" style="display:none;">
            <h2 style="color:#00f3ff;">PLAYER NAME</h2>
            <input type="text" id="input-player-name" maxlength="6" placeholder="名前 (6文字まで)" style="font-size: 18px; width: 80%;">
            <button class="btn-action" onclick="submitPlayerName()">完了</button>
            <p id="name-wait-msg" class="status-badge"></p>
        </div>

        <!-- 6. 順番決めルーレット画面 -->
        <div id="screen-roulette" class="overlay-screen" style="display:none;">
            <div class="sub-title">TURN ORDER</div>
            <div id="roulette-display" style="font-size: 72px; font-weight: 900; color:#ff0055;">1</div>
            <p id="my-order-result" style="font-size: 16px; height: 24px; color:#00f3ff;"></p>
            <button id="btn-roulette-action" class="btn-action" onclick="handleRouletteTap()">STOP</button>
        </div>

        <!-- 汎用モーダルダイアログ（色替え・プレイヤー選択等） -->
        <div id="modal-container" style="display:none;"></div>
    </div>

    <script>
        // ==========================================
        // グローバル変数 & 設定
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const PEER_PREFIX = 'cyber-puzzle-v2026-fix-';
        const ROWS = 15;
        const COLS = 8;
        const RADIUS = 18;
        const DIAMETER = RADIUS * 2;
        const ROW_HEIGHT = RADIUS * Math.sqrt(3);

        // 5色の基本玉カラー
        const BASE_COLORS = ['#ff0055', '#00f3ff', '#00ff66', '#ffe600', '#b000ff'];

        let gameState = 'title';
        let battleRole = '';
        let roomCode = '';
        let myPlayerId = 0;
        let maxPlayers = 2;
        let targetWins = 1;
        let ojamaMultiplier = 1;

        let peer = null;
        let guestConn = null;
        let hostConnections = [];

        let players = []; 
        let readyCount = 0;

        let rouletteState = 'idle';
        let myOrderNum = 0;
        let rouletteInterval = null;

        // ゲーム進行状態
        let battleTurnState = 'waiting'; 
        let currentTurnPlayerId = 0;
        let grid = [];
        let clearedCount = 0; // 消した玉の総数
        let isEliminated = false;
        let isCheckingVictory = true;

        // ターンタイマー (10秒制限)
        let turnTimer = 10;
        let turnTimerInterval = null;

        // 持ちアイテム情報
        let inventory = {
            double: 0, triple: 0, skip: 0, pierce: 0,
            color: 0, redirect: 0, forceshoot: 0, defense: 0
        };

        // アクティブ効果ステータス
        let activeBuffs = {
            multiplier: 1,  // お邪魔倍率バフ
            isPiercing: false, // 貫通フラグ
            redirectTarget: null, // おしつけ対象ID
            redirectTurns: 0,
            isDefending: false, // 防御フラグ
            forceShootDisabled: false // アイテム使用不可＋強制発射された状態
        };

        // 発射台
        let shooterX = 165;
        let shooterY = 560;
        let bulletX = shooterX;
        let bulletY = shooterY;
        let bulletVX = 0;
        let bulletVY = 0;
        let bulletData = null;
        let nextBubble = null;
        let isMoving = false;
        let wallReflections = 0; // 反射回数
        const MAX_SPEED = 16;

        // 飛んでくるお邪魔玉アニメーションオブジェクト
        let flyingOjamaBalls = [];

        // 死亡ラインのY座標（発射位置の2玉上）
        const DEAD_LINE_Y = shooterY - (DIAMETER * 2);

        // ==========================================
        // ネットワーク & 画面切替
        // ==========================================
        function showScreen(screenId) {
            document.querySelectorAll('.overlay-screen').forEach(s => s.style.display = 'none');
            if (screenId) {
                let el = document.getElementById(screenId);
                if (el) el.style.display = 'flex';
            }
        }

        function selectMainMenu(choice) {
            closeNetwork();
            if (choice === 'host') {
                battleRole = 'host';
                showScreen('screen-host-config');
            } else if (choice === 'guest') {
                battleRole = 'guest';
                document.getElementById('guest-status-msg').innerText = '';
                showScreen('screen-guest-join');
            }
        }

        function closeNetwork() {
            if (guestConn) { try { guestConn.close(); } catch(e){} guestConn = null; }
            hostConnections.forEach(c => { try { c.close(); } catch(e){} });
            hostConnections = [];
            if (peer) { try { peer.destroy(); } catch(e){} peer = null; }
        }

        function confirmHostSettings() {
            maxPlayers = parseInt(document.getElementById('select-max-players').value);
            targetWins = parseInt(document.getElementById('select-target-wins').value);
            ojamaMultiplier = parseInt(document.getElementById('select-ojama-mult').value);

            roomCode = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('display-room-code').innerText = roomCode;
            document.getElementById('host-wait-status').innerText = "CONNECTING...";
            showScreen('screen-host-wait');

            peer = new Peer(PEER_PREFIX + roomCode);
            players = [{ id: 0, name: '', order: 0, wins: 0, eliminated: false }];
            myPlayerId = 0;

            peer.on('open', () => updateHostWaitStatus());

            peer.on('connection', (conn) => {
                let assignedId = players.length;
                if (assignedId >= maxPlayers) { conn.close(); return; }

                hostConnections.push(conn);
                players.push({ id: assignedId, name: '', order: 0, wins: 0, eliminated: false });

                conn.on('open', () => {
                    conn.send({ type: 'init_guest', playerId: assignedId, maxPlayers: maxPlayers, ojamaMult: ojamaMultiplier, players: players });
                    updateHostWaitStatus();
                    if (players.length === maxPlayers) {
                        broadcastHost({ type: 'start_name_input', players: players });
                        showScreen('screen-name-input');
                    }
                });

                conn.on('data', (data) => handleHostReceiveData(assignedId, data));
            });
        }

        function updateHostWaitStatus() {
            let el = document.getElementById('host-wait-status');
            if (el) el.innerText = `WAITING... (${players.length}/${maxPlayers})`;
        }

        function joinRoom() {
            let code = document.getElementById('input-room-code').value.trim();
            let statusMsg = document.getElementById('guest-status-msg');

            if (code.length !== 4) { statusMsg.innerText = "4桁のコードを入力してください"; return; }
            roomCode = code;
            statusMsg.innerText = "CONNECTING...";

            peer = new Peer();
            peer.on('open', () => {
                guestConn = peer.connect(PEER_PREFIX + roomCode);
                guestConn.on('open', () => { statusMsg.innerText = "CONNECTED!"; });
                guestConn.on('data', handleGuestReceiveData);
            });
        }

        function broadcastHost(data) {
            hostConnections.forEach(c => { if (c && c.open) c.send(data); });
        }

        function sendToHost(data) {
            if (guestConn && guestConn.open) guestConn.send(data);
        }

        function handleHostReceiveData(fromId, data) {
            if (data.type === 'submit_name') {
                let p = players.find(item => item.id === fromId);
                if (p) p.name = data.name;
                broadcastHost({ type: 'sync_players', players: players });
                checkAllNamesSubmitted();
            } else if (data.type === 'ready_start') {
                readyCount++;
                if (readyCount === maxPlayers) {
                    broadcastHost({ type: 'game_start_signal', players: players });
                    launchGameStartNotice();
                }
            } else if (data.type === 'send_ojama') {
                // お邪魔玉転送
                handleOjamaRouting(data.targetId, data.count);
            } else if (data.type === 'use_item_action') {
                handleNetworkItemAction(data);
            } else if (data.type === 'player_eliminated') {
                let p = players.find(item => item.id === fromId);
                if (p) p.eliminated = true;
                broadcastHost({ type: 'sync_players', players: players });
                checkVictoryConditionHost();
            } else if (data.type === 'end_turn') {
                advanceTurnHost();
            }
        }

        function handleGuestReceiveData(data) {
            if (data.type === 'init_guest') {
                myPlayerId = data.playerId;
                maxPlayers = data.maxPlayers;
                if (data.players) players = data.players;
            } else if (data.type === 'start_name_input') {
                if (data.players) players = data.players;
                showScreen('screen-name-input');
            } else if (data.type === 'start_roulette') {
                players = data.players;
                showScreen('screen-roulette');
                startRouletteAnimation();
            } else if (data.type === 'game_start_signal') {
                if (data.players) players = data.players;
                launchGameStartNotice();
            } else if (data.type === 'receive_ojama') {
                if (data.targetId === myPlayerId) triggerOjamaFlyIn(data.count);
            } else if (data.type === 'sync_turn') {
                currentTurnPlayerId = data.currentTurnPlayerId;
                onTurnChanged();
            } else if (data.type === 'apply_item_effect') {
                applyItemEffectLocal(data);
            } else if (data.type === 'game_over_win') {
                showGameOverBanner(data.winnerName + " WIN!");
            }
        }

        // ==========================================
        // ルーレット & 初期化
        // ==========================================
        function submitPlayerName() {
            let inputName = document.getElementById('input-player-name').value.trim();
            if (!inputName) inputName = "P" + (myPlayerId + 1);

            let myP = players.find(p => p.id === myPlayerId);
            if (myP) myP.name = inputName;

            document.getElementById('name-wait-msg').innerText = "WAITING FOR OTHERS...";

            if (battleRole === 'host') {
                checkAllNamesSubmitted();
            } else {
                sendToHost({ type: 'submit_name', name: inputName });
            }
        }

        function checkAllNamesSubmitted() {
            if (players.length < maxPlayers) return;
            if (players.every(p => p.name && p.name.trim() !== '')) {
                let orders = Array.from({length: maxPlayers}, (_, i) => i + 1).sort(() => Math.random() - 0.5);
                players.forEach((p, idx) => p.order = orders[idx]);

                broadcastHost({ type: 'start_roulette', players: players });
                showScreen('screen-roulette');
                startRouletteAnimation();
            }
        }

        function startRouletteAnimation() {
            rouletteState = 'running';
            let disp = document.getElementById('roulette-display');
            let count = 1;
            rouletteInterval = setInterval(() => {
                disp.innerText = count;
                count = (count % maxPlayers) + 1;
            }, 80);
        }

        function handleRouletteTap() {
            let btn = document.getElementById('btn-roulette-action');
            if (rouletteState === 'running') {
                clearInterval(rouletteInterval);
                rouletteState = 'stopped';
                let myP = players.find(p => p.id === myPlayerId);
                myOrderNum = myP ? myP.order : 1;
                document.getElementById('roulette-display').innerText = myOrderNum;
                document.getElementById('my-order-result').innerText = `YOU ARE NO. ${myOrderNum}`;
                btn.innerText = "READY";
            } else if (rouletteState === 'stopped') {
                rouletteState = 'ready_wait';
                btn.innerText = "WAITING...";
                if (battleRole === 'host') {
                    readyCount++;
                    if (readyCount === maxPlayers) {
                        broadcastHost({ type: 'game_start_signal', players: players });
                        launchGameStartNotice();
                    }
                } else {
                    sendToHost({ type: 'ready_start' });
                }
            }
        }

        function launchGameStartNotice() {
            showScreen('');
            document.getElementById('side-gui').style.display = 'flex';
            
            let myP = players.find(p => p.id === myPlayerId);
            document.getElementById('gui-player-name').innerText = myP ? myP.name : 'PLAYER';

            gameState = 'playing';
            initGridForBattle();
            bulletData = null;
            spawnBullet();
            updateGUIItemButtons();

            let firstPlayer = players.find(p => p && p.order === 1);
            currentTurnPlayerId = firstPlayer ? firstPlayer.id : 0;
            onTurnChanged();

            let notice = document.createElement('div');
            notice.style.cssText = "position:absolute; top:40%; left:40%; transform:translate(-50%, -50%); font-size:28px; font-weight:900; color:#00f3ff; text-shadow:0 0 15px #00f3ff; z-index:200; font-style:italic;";
            notice.innerText = "BATTLE START!";
            document.getElementById('game-container').appendChild(notice);
            setTimeout(() => notice.remove(), 2000);
        }

        // ==========================================
        // ターン制御 & タイマー (10秒)
        // ==========================================
        function onTurnChanged() {
            clearInterval(turnTimerInterval);
            turnTimer = 10;

            if (currentTurnPlayerId === myPlayerId) {
                battleTurnState = 'my_turn';
                if (activeBuffs.forceShootDisabled) {
                    // 強制発射処理
                    setTimeout(() => forceAutoShoot(), 800);
                }
            } else {
                battleTurnState = 'opponent_turn';
            }

            // タイマー開始
            turnTimerInterval = setInterval(() => {
                if (gameState !== 'playing') return;
                turnTimer--;
                if (turnTimer <= 0) {
                    clearInterval(turnTimerInterval);
                    if (battleTurnState === 'my_turn' && !isMoving) {
                        forceAutoShoot(); // 時間切れ自動発射
                    }
                }
            }, 1000);

            // デバフ減衰
            if (battleTurnState === 'my_turn') {
                if (activeBuffs.redirectTurns > 0) {
                    activeBuffs.redirectTurns--;
                    if (activeBuffs.redirectTurns === 0) activeBuffs.redirectTarget = null;
                }
            }
        }

        function endMyTurn() {
            clearInterval(turnTimerInterval);
            battleTurnState = 'waiting';
            activeBuffs.multiplier = 1;
            activeBuffs.isPiercing = false;
            activeBuffs.isDefending = false;
            activeBuffs.forceShootDisabled = false;

            // 次のターンへランダムなギミック玉（?玉）の生成チェック (20%の確率で1玉)
            spawnGimmickBubble();

            if (battleRole === 'host') {
                advanceTurnHost();
            } else {
                sendToHost({ type: 'end_turn' });
            }
        }

        function advanceTurnHost() {
            let activePlayers = players.filter(p => !p.eliminated);
            if (activePlayers.length <= 1) {
                checkVictoryConditionHost();
                return;
            }
            let currentP = players.find(p => p.id === currentTurnPlayerId);
            let nextOrder = (currentP ? currentP.order : 1) % maxPlayers + 1;
            
            // 脱落していない次のプレイヤーを探す
            let nextP = players.find(p => p.order === nextOrder);
            while (nextP && nextP.eliminated) {
                nextOrder = (nextOrder % maxPlayers) + 1;
                nextP = players.find(p => p.order === nextOrder);
            }

            currentTurnPlayerId = nextP ? nextP.id : 0;
            broadcastHost({ type: 'sync_turn', currentTurnPlayerId: currentTurnPlayerId });
            onTurnChanged();
        }

        // ==========================================
        // パズルコアロジック & お邪魔玉
        // ==========================================
        function getRandomGridCell() {
            return { color: BASE_COLORS[Math.floor(Math.random() * BASE_COLORS.length)], isGimmick: false };
        }

        function getRandomShooterBubble() {
            return { color: BASE_COLORS[Math.floor(Math.random() * BASE_COLORS.length)], isGimmick: false };
        }

        function initGridForBattle() {
            grid = [];
            for (let r = 0; r < ROWS; r++) {
                let row = [];
                let colsInRow = (r % 2 === 0) ? COLS : COLS - 1;
                for (let c = 0; c < colsInRow; c++) row.push(null);
                grid.push(row);
            }
            for (let r = 0; r < 5; r++) {
                let colsInRow = (r % 2 === 0) ? COLS : COLS - 1;
                for (let c = 0; c < colsInRow; c++) {
                    grid[r][c] = getRandomGridCell();
                }
            }
        }

        function spawnGimmickBubble() {
            if (Math.random() < 0.20) { // 20%の確率
                let emptyCells = [];
                for (let r = 0; r < 8; r++) {
                    let colsInRow = (r % 2 === 0) ? COLS : COLS - 1;
                    for (let c = 0; c < colsInRow; c++) {
                        if (grid[r] && grid[r][c]) emptyCells.push({r, c});
                    }
                }
                if (emptyCells.length > 0) {
                    let target = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    grid[target.r][target.c].isGimmick = true;
                }
            }
        }

        function spawnBullet() {
            bulletData = bulletData ? nextBubble : getRandomShooterBubble();
            nextBubble = getRandomShooterBubble();

            shooterX = 165;
            shooterY = 560;
            bulletX = shooterX;
            bulletY = shooterY;
            bulletVX = 0;
            bulletVY = 0;
            isMoving = false;
            wallReflections = 0;
        }

        // スワイプ発射操作
        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd, { passive: false });

        let touchStartX = 0, touchStartY = 0;

        function handleTouchStart(e) {
            if (gameState !== 'playing' || isMoving || battleTurnState !== 'my_turn') return;
            e.preventDefault();
            let touch = e.touches[0];
            let rect = canvas.getBoundingClientRect();
            touchStartX = touch.clientX - rect.left;
            touchStartY = touch.clientY - rect.top;
        }

        function handleTouchEnd(e) {
            if (gameState !== 'playing' || isMoving || battleTurnState !== 'my_turn') return;
            e.preventDefault();
            let touch = e.changedTouches[0];
            let rect = canvas.getBoundingClientRect();
            let dx = touchStartX - (touch.clientX - rect.left);
            let dy = touchStartY - (touch.clientY - rect.top);

            if (dy > 20) {
                shootBulletAngle(Math.atan2(dx, dy));
            }
        }

        function forceAutoShoot() {
            if (isMoving) return;
            let randomAngle = (Math.random() * 1.2) - 0.6; // ランダム角度
            shootBulletAngle(randomAngle);
        }

        function shootBulletAngle(angle) {
            bulletVX = Math.sin(angle) * MAX_SPEED;
            bulletVY = -Math.cos(angle) * MAX_SPEED;
            isMoving = true;
        }

        // 移動・着地判定
        function updateBulletPhysics() {
            if (!isMoving || !bulletData) return;

            bulletX += bulletVX;
            bulletY += bulletVY;

            // 左右壁の反射判定
            if (bulletX - RADIUS < 0) {
                bulletX = RADIUS;
                bulletVX = -bulletVX;
                wallReflections++;
            } else if (bulletX + RADIUS > canvas.width) {
                bulletX = canvas.width - RADIUS;
                bulletVX = -bulletVX;
                wallReflections++;
            }

            // 貫通アイテム使用時の壁反射警告
            if (activeBuffs.isPiercing && wallReflections >= 2) {
                showWarningText("反射限界！");
                isMoving = false;
                spawnBullet();
                return;
            }

            // 貫通玉処理（衝突した玉をすべて消去）
            if (activeBuffs.isPiercing) {
                for (let r = 0; r < ROWS; r++) {
                    let colsInRow = (r % 2 === 0) ? COLS : COLS - 1;
                    let rowXOffset = (r % 2 === 0) ? RADIUS : RADIUS * 2;
                    for (let c = 0; c < colsInRow; c++) {
                        if (grid[r][c]) {
                            let cx = rowXOffset + c * DIAMETER;
                            let cy = RADIUS + r * ROW_HEIGHT;
                            let dist = Math.hypot(bulletX - cx, bulletY - cy);
                            if (dist < DIAMETER) {
                                grid[r][c] = null; // 消去
                                clearedCount++;
                            }
                        }
                    }
                }
                if (bulletY < RADIUS) { // 最上部壁で終了
                    isMoving = false;
                    document.getElementById('gui-cleared-count').innerText = clearedCount;
                    endMyTurn();
                    spawnBullet();
                }
                return;
            }

            // 通常玉の着地判定
            let hit = false;
            if (bulletY <= RADIUS) { hit = true; } // 最上部到達

            if (!hit) {
                for (let r = 0; r < ROWS; r++) {
                    let colsInRow = (r % 2 === 0) ? COLS : COLS - 1;
                    let rowXOffset = (r % 2 === 0) ? RADIUS : RADIUS * 2;
                    for (let c = 0; c < colsInRow; c++) {
                        if (grid[r][c]) {
                            let cx = rowXOffset + c * DIAMETER;
                            let cy = RADIUS + r * ROW_HEIGHT;
                            if (Math.hypot(bulletX - cx, bulletY - cy) < DIAMETER - 2) {
                                hit = true;
                                break;
                            }
                        }
                    }
                    if (hit) break;
                }
            }

            if (hit) {
                isMoving = false;
                snapBulletToGrid();
            }
        }

        function snapBulletToGrid() {
            let bestR = 0, bestC = 0, minDist = 9999;
            for (let r = 0; r < ROWS; r++) {
                let colsInRow = (r % 2 === 0) ? COLS : COLS - 1;
                let rowXOffset = (r % 2 === 0) ? RADIUS : RADIUS * 2;
                for (let c = 0; c < colsInRow; c++) {
                    if (!grid[r][c]) {
                        let cx = rowXOffset + c * DIAMETER;
                        let cy = RADIUS + r * ROW_HEIGHT;
                        let d = Math.hypot(bulletX - cx, bulletY - cy);
                        if (d < minDist) {
                            minDist = d;
                            bestR = r;
                            bestC = c;
                        }
                    }
                }
            }

            grid[bestR][bestC] = { color: bulletData.color, isGimmick: bulletData.isGimmick };
            checkMatchAndClear(bestR, bestC);
        }

        // 3つ以上並んだ玉の消去＆お邪魔玉送信
        function checkMatchAndClear(startR, startC) {
            let targetColor = grid[startR][startC].color;
            let matched = [];
            let visited = Array.from({length: ROWS}, () => Array(COLS).fill(false));

            function dfs(r, c) {
                if (r < 0 || r >= ROWS) return;
                let colsInRow = (r % 2 === 0) ? COLS : COLS - 1;
                if (c < 0 || c >= colsInRow) return;
                if (visited[r][c] || !grid[r][c] || grid[r][c].color !== targetColor) return;

                visited[r][c] = true;
                matched.push({r, c, isGimmick: grid[r][c].isGimmick});

                // 隣接6方向の探索
                let neighbors = (r % 2 === 0) ? 
                    [[r-1, c-1], [r-1, c], [r, c-1], [r, c+1], [r+1, c-1], [r+1, c]] :
                    [[r-1, c], [r-1, c+1], [r, c-1], [r, c+1], [r+1, c], [r+1, c+1]];

                for (let [nr, nc] of neighbors) dfs(nr, nc);
            }

            dfs(startR, startC);

            if (matched.length >= 3) {
                // 玉消去
                matched.forEach(cell => {
                    grid[cell.r][cell.c] = null;
                    if (cell.isGimmick) grantRandomItem(); // ?玉を消したらアイテム獲得
                });

                clearedCount += matched.length;
                document.getElementById('gui-cleared-count').innerText = clearedCount;

                // お邪魔玉個数計算: 消した数 × (設定倍率 × アイテム倍率)
                let sendCount = matched.length * (ojamaMultiplier * activeBuffs.multiplier);
                sendOjamaToOpponent(sendCount);

                // 勝利条件②: 消した玉500個達成
                if (clearedCount >= 500) {
                    triggerVictory();
                    return;
                }
            }

            checkDeadLineLoss();
            endMyTurn();
            spawnBullet();
        }

        // お邪魔玉の送受信ルーティング
        function sendOjamaToOpponent(count) {
            let targetId = activeBuffs.redirectTarget;
            if (targetId === null) {
                // デフォルトは自分以外の生存プレイヤー
                let opponents = players.filter(p => p.id !== myPlayerId && !p.eliminated);
                if (opponents.length > 0) targetId = opponents[Math.floor(Math.random() * opponents.length)].id;
            }

            if (targetId !== null) {
                if (battleRole === 'host') {
                    handleOjamaRouting(targetId, count);
                } else {
                    sendToHost({ type: 'send_ojama', targetId: targetId, count: count });
                }
            }
        }

        function handleOjamaRouting(targetId, count) {
            let targetP = players.find(p => p.id === targetId);
            if (!targetP || targetP.eliminated) return;

            // 防御中の場合は半減
            if (targetId === myPlayerId && activeBuffs.isDefending) {
                count = Math.floor(count / 2);
            }

            if (targetId === myPlayerId) {
                triggerOjamaFlyIn(count);
            } else {
                broadcastHost({ type: 'receive_ojama', targetId: targetId, count: count });
            }
        }

        // お邪魔玉が画面下から飛んできて着地する演出
        function triggerOjamaFlyIn(count) {
            if (count <= 0) return;
            isCheckingVictory = false; // 飛行着地中は判定を一時ストップ

            for (let i = 0; i < count; i++) {
                flyingOjamaBalls.push({
                    x: Math.random() * (canvas.width - 40) + 20,
                    y: canvas.height + 30,
                    targetColor: BASE_COLORS[Math.floor(Math.random() * BASE_COLORS.length)],
                    speed: 12 + Math.random() * 6
                });
            }
        }

        function updateFlyingOjama() {
            for (let i = flyingOjamaBalls.length - 1; i >= 0; i--) {
                let ball = flyingOjamaBalls[i];
                ball.y -= ball.speed;

                // 画面上部付近まで飛んだら空き隙間を探して着地
                if (ball.y < 100) {
                    landOjamaInGrid(ball.targetColor);
                    flyingOjamaBalls.splice(i, 1);
                }
            }

            if (flyingOjamaBalls.length === 0 && !isCheckingVictory) {
                isCheckingVictory = true;
                checkDeadLineLoss(); // 着地完了後に敗北・勝利判定を再開
            }
        }

        function landOjamaInGrid(color) {
            for (let r = 0; r < ROWS; r++) {
                let colsInRow = (r % 2 === 0) ? COLS : COLS - 1;
                for (let c = 0; c < colsInRow; c++) {
                    if (!grid[r][c]) {
                        grid[r][c] = { color: color, isGimmick: false };
                        return;
                    }
                }
            }
        }

        // 敗北（デッドライン到達）判定
        function checkDeadLineLoss() {
            if (!isCheckingVictory || isEliminated) return;

            for (let r = 0; r < ROWS; r++) {
                let colsInRow = (r % 2 === 0) ? COLS : COLS - 1;
                for (let c = 0; c < colsInRow; c++) {
                    if (grid[r][c]) {
                        let cy = RADIUS + r * ROW_HEIGHT;
                        if (cy >= DEAD_LINE_Y) {
                            // 脱落！
                            isEliminated = true;
                            showWarningText("脱落！");
                            if (battleRole === 'host') {
                                let p = players.find(p => p.id === myPlayerId);
                                if (p) p.eliminated = true;
                                checkVictoryConditionHost();
                            } else {
                                sendToHost({ type: 'player_eliminated' });
                            }
                            return;
                        }
                    }
                }
            }
        }

        function checkVictoryConditionHost() {
            let activePlayers = players.filter(p => !p.eliminated);
            if (activePlayers.length === 1) {
                let winner = activePlayers[0];
                broadcastHost({ type: 'game_over_win', winnerName: winner.name });
                showGameOverBanner(winner.name + " WIN!");
            }
        }

        function triggerVictory() {
            let myP = players.find(p => p.id === myPlayerId);
            showGameOverBanner((myP ? myP.name : "YOU") + " WIN!");
        }

        function showGameOverBanner(msg) {
            gameState = 'ended';
            let notice = document.createElement('div');
            notice.style.cssText = "position:absolute; top:50%; left:40%; transform:translate(-50%, -50%); font-size:36px; font-weight:900; color:#ffe600; text-shadow:0 0 20px #ffe600; z-index:300;";
            notice.innerText = msg;
            document.getElementById('game-container').appendChild(notice);
        }

        function showWarningText(msg) {
            let notice = document.createElement('div');
            notice.style.cssText = "position:absolute; top:30%; left:40%; transform:translate(-50%, -50%); font-size:24px; font-weight:900; color:#ff0055; text-shadow:0 0 10px #ff0055; z-index:250;";
            notice.innerText = msg;
            document.getElementById('game-container').appendChild(notice);
            setTimeout(() => notice.remove(), 1500);
        }

        // ==========================================
        // アイテム処理
        // ==========================================
        function grantRandomItem() {
            const keys = Object.keys(inventory);
            let granted = keys[Math.floor(Math.random() * keys.length)];
            inventory[granted]++;
            updateGUIItemButtons();
            showWarningText("ITEM GET!");
        }

        function updateGUIItemButtons() {
            for (let k in inventory) {
                let btn = document.getElementById('btn-item-' + k);
                let cnt = document.getElementById('cnt-' + k);
                if (cnt) cnt.innerText = inventory[k];
                if (btn) {
                    if (inventory[k] > 0 && battleTurnState === 'my_turn' && !activeBuffs.forceShootDisabled) {
                        btn.classList.remove('disabled');
                    } else {
                        btn.classList.add('disabled');
                    }
                }
            }
        }

        function useItem(type) {
            if (inventory[type] <= 0 || battleTurnState !== 'my_turn' || activeBuffs.forceShootDisabled) return;

            if (type === 'double') {
                inventory.double--;
                activeBuffs.multiplier = 2;
            } else if (type === 'triple') {
                inventory.triple--;
                activeBuffs.multiplier = 3;
            } else if (type === 'skip') {
                inventory.skip--;
                sendItemActionToHost({ type: 'skip_target' });
            } else if (type === 'pierce') {
                inventory.pierce--;
                activeBuffs.isPiercing = true;
            } else if (type === 'color') {
                showColorPickerModal();
                return;
            } else if (type === 'redirect') {
                showPlayerSelectModal((targetId) => {
                    inventory.redirect--;
                    activeBuffs.redirectTarget = targetId;
                    activeBuffs.redirectTurns = 2; // 2ターン（1周分）継続
                    updateGUIItemButtons();
                });
                return;
            } else if (type === 'forceshoot') {
                showPlayerSelectModal((targetId) => {
                    inventory.forceshoot--;
                    sendItemActionToHost({ type: 'force_shoot_target', targetId: targetId });
                    updateGUIItemButtons();
                });
                return;
            } else if (type === 'defense') {
                inventory.defense--;
                activeBuffs.isDefending = true;
            }

            updateGUIItemButtons();
        }

        function sendItemActionToHost(data) {
            data.fromId = myPlayerId;
            if (battleRole === 'host') {
                handleNetworkItemAction(data);
            } else {
                sendToHost({ type: 'use_item_action', ...data });
            }
        }

        function handleNetworkItemAction(data) {
            if (data.type === 'skip_target') {
                advanceTurnHost(); // スキップ
            } else if (data.type === 'force_shoot_target') {
                broadcastHost({ type: 'apply_item_effect', effect: 'forceshoot', targetId: data.targetId });
            }
        }

        function applyItemEffectLocal(data) {
            if (data.targetId === myPlayerId && data.effect === 'forceshoot') {
                activeBuffs.forceShootDisabled = true;
                showWarningText("勝手に発射！");
                updateGUIItemButtons();
            }
        }

        // 色替えモーダル
        function showColorPickerModal() {
            clearInterval(turnTimerInterval); // タイマーストップ
            let modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="modal-dialog">
                    <div style="font-size:12px; color:#00f3ff; text-align:center;">色替え：元の色を選択</div>
                    <div class="color-selector-box" id="from-colors"></div>
                    <div style="font-size:12px; color:#ffe600; text-align:center;">変更後の色を選択</div>
                    <div class="color-selector-box" id="to-colors"></div>
                    <button class="btn-action" onclick="closeModalAndResume()">キャンセル</button>
                </div>
            `;
            modal.style.display = 'block';

            let selectedFrom = null, selectedTo = null;
            let fromContainer = document.getElementById('from-colors');
            let toContainer = document.getElementById('to-colors');

            BASE_COLORS.forEach(c => {
                let d1 = document.createElement('div');
                d1.className = 'color-dot';
                d1.style.backgroundColor = c;
                d1.onclick = () => { selectedFrom = c; d1.style.borderColor = '#00f3ff'; };
                fromContainer.appendChild(d1);

                let d2 = document.createElement('div');
                d2.className = 'color-dot';
                d2.style.backgroundColor = c;
                d2.onclick = () => {
                    selectedTo = c;
                    if (selectedFrom && selectedTo) {
                        applyColorChange(selectedFrom, selectedTo);
                        inventory.color--;
                        closeModalAndResume();
                    }
                };
                toContainer.appendChild(d2);
            });
        }

        function applyColorChange(fromColor, toColor) {
            for (let r = 0; r < ROWS; r++) {
                let colsInRow = (r % 2 === 0) ? COLS : COLS - 1;
                for (let c = 0; c < colsInRow; c++) {
                    if (grid[r][c] && grid[r][c].color === fromColor) {
                        grid[r][c].color = toColor;
                    }
                }
            }
        }

        function showPlayerSelectModal(callback) {
            let modal = document.getElementById('modal-container');
            let targets = players.filter(p => p.id !== myPlayerId && !p.eliminated);
            let buttonsHtml = targets.map(p => `<button class="btn-action" style="margin-bottom:6px;" onclick="selectTargetPlayer(${p.id})">${p.name}</button>`).join('');

            modal.innerHTML = `
                <div class="modal-dialog">
                    <div style="font-size:14px; color:#00f3ff; text-align:center;">対象プレイヤーを選択</div>
                    ${buttonsHtml}
                    <button class="btn-action btn-secondary" onclick="closeModalAndResume()">キャンセル</button>
                </div>
            `;
            modal.style.display = 'block';

            window.selectTargetPlayer = (id) => {
                modal.style.display = 'none';
                callback(id);
            };
        }

        function closeModalAndResume() {
            document.getElementById('modal-container').style.display = 'none';
            onTurnChanged(); // タイマー再開
        }

        // ==========================================
        // メイン描画ループ
        // ==========================================
        function gameLoop() {
            ctx.fillStyle = '#0d111e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'playing' || gameState === 'ended') {
                // 1. デッドライン（点線）描画
                ctx.beginPath();
                ctx.setLineDash([6, 6]);
                ctx.moveTo(0, DEAD_LINE_Y);
                ctx.lineTo(canvas.width, DEAD_LINE_Y);
                ctx.strokeStyle = '#ff0055';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.setLineDash([]);

                // 2. 玉グリッド描画
                for (let r = 0; r < ROWS; r++) {
                    if (!grid[r]) continue;
                    let colsInRow = (r % 2 === 0) ? COLS : COLS - 1;
                    let rowXOffset = (r % 2 === 0) ? RADIUS : RADIUS * 2;

                    for (let c = 0; c < colsInRow; c++) {
                        let cell = grid[r][c];
                        if (cell) {
                            let cx = rowXOffset + c * DIAMETER;
                            let cy = RADIUS + r * ROW_HEIGHT;

                            ctx.beginPath();
                            ctx.arc(cx, cy, RADIUS - 2, 0, Math.PI * 2);
                            ctx.fillStyle = cell.color;
                            ctx.shadowColor = cell.color;
                            ctx.shadowBlur = cell.isGimmick ? 15 : 6;
                            ctx.fill();
                            ctx.shadowBlur = 0;

                            if (cell.isGimmick) { // ?ギミック描画
                                ctx.fillStyle = '#ffffff';
                                ctx.font = 'bold 14px sans-serif';
                                ctx.textAlign = 'center';
                                ctx.textBaseline = 'middle';
                                ctx.fillText('?', cx, cy);
                            }
                        }
                    }
                }

                // 3. 物理演算 ＆ 移動中の発射玉
                updateBulletPhysics();

                if (bulletData) {
                    ctx.beginPath();
                    ctx.arc(bulletX, bulletY, RADIUS - 2, 0, Math.PI * 2);
                    ctx.fillStyle = bulletData.color;
                    ctx.shadowColor = bulletData.color;
                    ctx.shadowBlur = activeBuffs.isPiercing ? 20 : 8;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                // 4. 控え玉
                if (nextBubble) {
                    ctx.beginPath();
                    ctx.arc(30, 600, RADIUS * 0.75, 0, Math.PI * 2);
                    ctx.fillStyle = nextBubble.color;
                    ctx.fill();
                }

                // 5. 飛んでくるお邪魔玉描画
                updateFlyingOjama();
                flyingOjamaBalls.forEach(ball => {
                    ctx.beginPath();
                    ctx.arc(ball.x, ball.y, RADIUS - 2, 0, Math.PI * 2);
                    ctx.fillStyle = ball.targetColor;
                    ctx.shadowColor = '#ff0055';
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });

                // 6. 制限時間 ＆ ターン表示
                if (battleTurnState === 'my_turn') {
                    ctx.fillStyle = '#00f3ff';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(`YOUR TURN (${turnTimer}s)`, 165, 625);

                    // 5秒前カウントダウン中央特大表示
                    if (turnTimer <= 5) {
                        ctx.fillStyle = '#ff0055';
                        ctx.font = '900 72px sans-serif';
                        ctx.fillText(turnTimer, 165, 320);
                    }
                } else {
                    ctx.fillStyle = '#ff0055';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText("WAITING OPPONENT...", 165, 625);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
