<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>○o WING GAME 玉 o○</title>
    <!-- PeerJS (通信用ライブラリ) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100dvh;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        canvas {
            background: #1a1a1a;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 1;
            touch-action: none;
        }
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(17, 17, 17, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 100;
            text-align: center;
        }
        .overlay-screen h2 {
            color: #ffcc00;
            font-size: 26px;
            margin-bottom: 20px;
        }
        .title-logo {
            font-size: 28px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 0 12px rgba(255, 204, 0, 0.6);
            margin-bottom: 40px;
            animation: dropDown 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes dropDown {
            0% { transform: translateY(-200px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        .version-text {
            font-size: 14px;
            color: #ffffff;
            margin-top: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .menu-btn {
            background: #ffcc00;
            color: #111;
            border: none;
            padding: 16px 20px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 18px;
            margin: 8px 0;
            width: 85%;
            max-width: 280px;
            cursor: pointer;
        }
        .menu-btn:active {
            transform: scale(0.96);
            opacity: 0.9;
        }
        .menu-btn.sub { background: #4da6ff; color: #fff; }
        .menu-btn.gray { background: #555; color: #fff; }
        input.text-input {
            background: #222;
            border: 2px solid #ffcc00;
            color: #fff;
            font-size: 24px;
            text-align: center;
            padding: 10px;
            border-radius: 10px;
            width: 220px;
            margin: 15px 0;
        }
        #status-message {
            color: #ff4d4d;
            font-size: 14px;
            margin-top: 10px;
            height: 20px;
        }
        .rules-box {
            background: #222;
            border: 1px solid #555;
            padding: 16px;
            border-radius: 10px;
            font-size: 14px;
            text-align: left;
            line-height: 1.5;
            max-width: 320px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="700"></canvas>

        <!-- タイトル画面 -->
        <div id="screen-title" class="overlay-screen" style="display: flex;">
            <div class="title-logo">WING GAME 玉</div>
            <button class="menu-btn" onclick="showScreen('screen-role-select')">対戦モード</button>
            <button class="menu-btn sub" onclick="showScreen('screen-how-to-play')">遊び方</button>
            <div class="version-text">Version 2026</div>
        </div>

        <!-- 遊び方画面 -->
        <div id="screen-how-to-play" class="overlay-screen">
            <h2>遊び方</h2>
            <div class="rules-box">
                • 引っ張って離すと玉が発射されます。<br>
                • 同じ色の玉を3つ以上繋げると消えます。<br>
                • 対戦モードでは相手にお邪魔玉を送ったり、特殊ルールで競い合います！
            </div>
            <button class="menu-btn" onclick="showScreen('screen-title')">戻る</button>
        </div>

        <!-- ロール選択画面 -->
        <div id="screen-role-select" class="overlay-screen">
            <h2>対戦モード</h2>
            <button class="menu-btn" onclick="setupRole('host')">部屋を作る (ホスト)</button>
            <button class="menu-btn sub" onclick="setupRole('guest')">部屋に参加 (ゲスト)</button>
            <button class="menu-btn gray" onclick="showScreen('screen-title')">戻る</button>
        </div>

        <!-- ホスト待機画面 -->
        <div id="screen-host-wait" class="overlay-screen">
            <h2>対戦設定</h2>
            <p style="font-size: 14px; color: #ccc; margin-bottom: 5px;">ルームコード</p>
            <div id="display-room-code" style="font-size: 36px; font-weight: bold; color: #ffcc00; letter-spacing: 4px; margin-bottom: 15px;">----</div>
            <p style="font-size: 13px; color: #aaa; margin-bottom: 15px;">このコードを対戦相手に伝えてください</p>
            
            <div style="margin-bottom: 15px; width: 100%; max-width: 280px; text-align: left;">
                <p style="font-size: 13px; color: #ffcc00; margin-bottom: 5px;">対戦ルール:</p>
                <div style="display: flex; gap: 8px;">
                    <button id="btn-mode-ojama" class="menu-btn sub" style="flex:1; margin:0; font-size:14px; padding:10px;" onclick="setHostBattleType('お邪魔対戦')">お邪魔対戦</button>
                    <button id="btn-mode-ta" class="menu-btn gray" style="flex:1; margin:0; font-size:14px; padding:10px;" onclick="setHostBattleType('500個消し対戦')">500個消し</button>
                </div>
            </div>

            <div style="margin-bottom: 20px; width: 100%; max-width: 280px; text-align: left;">
                <p style="font-size: 13px; color: #ffcc00; margin-bottom: 5px;">勝利条件 (先勝):</p>
                <div style="display: flex; gap: 8px;">
                    <button id="btn-win-1" class="menu-btn" style="flex:1; margin:0; font-size:14px; padding:10px;" onclick="setHostTargetWins(1)">1勝先取</button>
                    <button id="btn-win-2" class="menu-btn gray" style="flex:1; margin:0; font-size:14px; padding:10px;" onclick="setHostTargetWins(2)">2勝先取</button>
                </div>
            </div>

            <button class="menu-btn" onclick="confirmHostBattleSettings()">設定を決定して開始</button>
            <button class="menu-btn gray" onclick="showScreen('screen-role-select')">戻る</button>
        </div>

        <!-- ゲスト参加画面 -->
        <div id="screen-guest-join" class="overlay-screen">
            <h2>ルーム参加</h2>
            <p style="font-size: 14px; color: #ccc;">4桁のルームコードを入力</p>
            <input type="text" id="input-room-code" class="text-input" maxlength="4" placeholder="0000">
            <div id="status-message"></div>
            <button class="menu-btn" onclick="joinRoom()">接続する</button>
            <button class="menu-btn gray" onclick="showScreen('screen-role-select')">戻る</button>
        </div>

        <!-- ゲスト待機ルール確認画面 -->
        <div id="screen-guest-wait-rule" class="overlay-screen">
            <h2>待機中</h2>
            <p style="font-size: 16px; color: #4da6ff; margin-bottom: 20px;">ホストの設定を待っています...</p>
            <button class="menu-btn gray" onclick="showScreen('screen-role-select')">退出する</button>
        </div>

        <!-- バトルルール説明画面 -->
        <div id="screen-battle-rules-desc" class="overlay-screen">
            <h2>対戦ルール確認</h2>
            <div id="rules-text-content" class="rules-box"></div>
            <button class="menu-btn" onclick="readyToStartBattle()">バトル開始！</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
