<!DOCTYPE html>
<html lang="ja">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
 <title>○o WING GAME 玉 o○</title>
 <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
 <style>
 * {
 box-sizing: border-box;
 -webkit-touch-callout: none;
 -webkit-user-select: none;
 user-select: none;
 }
 body {
 margin: 0;
 padding: 0;
 background: #111;
 color: #fff;
 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 height: 100vh;
 height: 100dvh;
 overflow: hidden;
 touch-action: none;
 }
 #game-container {
 position: relative;
 width: 100vw;
 height: 100dvh;
 max-width: 480px;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 }
 canvas {
 background: #1a1a1a;
 box-shadow: 0 0 15px rgba(0,0,0,0.8);
 display: block;
 width: 100%;
 height: 100%;
 object-fit: contain;
 z-index: 1;
 touch-action: none;
 }
 .overlay-screen {
 position: absolute;
 top: 0;
 left: 0;
 width: 100%;
 height: 100%;
 background: rgba(17, 17, 17, 0.95);
 display: none;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 padding: 24px;
 z-index: 100;
 text-align: center;
 }
 .overlay-screen h2 {
 color: #ffcc00;
 font-size: 24px;
 margin-bottom: 15px;
 }
 .menu-btn {
 background: #ffcc00;
 color: #111;
 border: none;
 padding: 14px 20px;
 border-radius: 12px;
 font-weight: bold;
 font-size: 16px;
 margin: 6px 0;
 width: 85%;
 max-width: 280px;
 cursor: pointer;
 }
 .menu-btn:active {
 transform: scale(0.96);
 opacity: 0.9;
 }
 .menu-btn.sub { background: #4da6ff; color: #fff; }
 .menu-btn.gray { background: #555; color: #fff; }
 .menu-btn.danger { background: #ff4d4d; color: #fff; }
 input.text-input {
 background: #222;
 border: 2px solid #ffcc00;
 color: #fff;
 font-size: 20px;
 text-align: center;
 padding: 10px;
 border-radius: 10px;
 width: 220px;
 margin: 10px 0;
 }
 #status-message {
 color: #ff4d4d;
 font-size: 14px;
 margin-top: 10px;
 min-height: 20px;
 }
 .player-list {
 background: #222;
 border: 1px solid #444;
 border-radius: 8px;
 padding: 10px;
 width: 85%;
 max-width: 280px;
 margin: 10px 0;
 font-size: 14px;
 text-align: left;
 }
 .player-item {
 padding: 4px 0;
 border-bottom: 1px dashed #444;
 }
 .player-item:last-child {
 border-bottom: none;
 }
 #amida-canvas {
 background: #222;
 border: 2px solid #ffcc00;
 border-radius: 10px;
 margin: 10px 0;
 }
 .modal-overlay {
 position: absolute;
 top: 0; left: 0; width: 100%; height: 100%;
 background: rgba(0,0,0,0.85);
 display: none;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 z-index: 200;
 }
 </style>
</head>
<body>
 <div id="game-container">
 <canvas id="gameCanvas" width="400" height="700"></canvas>

 <!-- タイトル画面 -->
 <div id="screen-title" class="overlay-screen" style="display: flex;">
 <div class="title-logo">○o WING GAME 玉 o○</div>
 <div class="blink-text" onclick="goToHowToPlay()">TAP TO START</div>
 <div class="version-text">Ver 2.1 (Multiplay)</div>
 </div>

 <!-- ルール説明 -->
 <div id="screen-how-to-play" class="overlay-screen">
 <h2>遊び方</h2>
 <p style="font-size: 14px; line-height: 1.6; color: #ccc;">
 玉を引っ張って飛ばし、同じ色を3つ以上繋げて消そう！<br>
 画面下のラインを超えるとゲームオーバー！
 </p>
 <button class="menu-btn" onclick="showScreen('screen-mode-select')">次へ</button>
 </div>

 <!-- モード選択 -->
 <div id="screen-mode-select" class="overlay-screen">
 <h2>モード選択</h2>
 <button class="menu-btn" onclick="startSinglePlay()">1人で遊ぶ（シングル）</button>
 <button class="menu-btn sub" onclick="showScreen('screen-player-count-select')">フレンド対戦</button>
 <button class="menu-btn gray" onclick="showScreen('screen-title')">戻る</button>
 </div>

 <!-- 人数選択 -->
 <div id="screen-player-count-select" class="overlay-screen">
 <h2>何人で遊ぶ？</h2>
 <button class="menu-btn" onclick="selectPlayerCount(2)">２人対戦</button>
 <button class="menu-btn" onclick="selectPlayerCount(3)">３人対戦</button>
 <button class="menu-btn" onclick="selectPlayerCount(4)">４人対戦</button>
 <button class="menu-btn" onclick="selectPlayerCount(5)">５人対戦</button>
 <button class="menu-btn gray" onclick="showScreen('screen-mode-select')">戻る</button>
 </div>

 <!-- 対戦モード選択（2人専用） -->
 <div id="screen-battle-mode-select" class="overlay-screen">
 <h2>対戦モード選択</h2>
 <button id="btn-mode-ta" class="menu-btn sub" onclick="setHostBattleType('タイムアタック')">タイムアタック</button>
 <button id="btn-mode-ojama" class="menu-btn" onclick="setHostBattleType('お邪魔対戦')">お邪魔対戦</button>
 <button class="menu-btn" onclick="showScreen('screen-rule-wins-select')">次へ</button>
 <button class="menu-btn gray" onclick="showScreen('screen-player-count-select')">戻る</button>
 </div>

 <!-- 勝利ルール選択 -->
 <div id="screen-rule-wins-select" class="overlay-screen">
 <h2>勝利条件</h2>
 <p>何勝先取にする？</p>
 <button id="btn-win-1" class="menu-btn" onclick="setHostTargetWins(1)">先に1勝</button>
 <button id="btn-win-2" class="menu-btn gray" onclick="setHostTargetWins(2)">先に2勝</button>
 <button class="menu-btn sub" onclick="proceedToNameInput()">決定</button>
 </div>

 <!-- プレイヤー名入力 -->
 <div id="screen-name-input" class="overlay-screen">
 <h2>名前の入力</h2>
 <input type="text" id="input-player-name" class="text-input" placeholder="名前を入力" maxlength="8">
 <button class="menu-btn" onclick="confirmPlayerName()">次へ</button>
 </div>

 <!-- ホスト/ゲスト選択 -->
 <div id="screen-role-select" class="overlay-screen">
 <h2>部屋の作成 / 参加</h2>
 <button class="menu-btn" onclick="setupRole('host')">部屋を作る（ホスト）</button>
 <button class="menu-btn sub" onclick="setupRole('guest')">部屋に入る（ゲスト）</button>
 <button class="menu-btn gray" onclick="showScreen('screen-player-count-select')">戻る</button>
 </div>

 <!-- ホスト待機 -->
 <div id="screen-host-wait" class="overlay-screen">
 <h2>部屋コード</h2>
 <div id="display-room-code" style="font-size: 36px; font-weight: bold; color: #ffcc00; letter-spacing: 4px; margin: 15px 0;">----</div>
 <p style="font-size: 13px; color: #aaa;">全員にこの4桁のコードを教えてください</p>
 <div class="player-list" id="host-player-list">
 <div class="player-item">参加メンバー:</div>
 </div>
 <button id="btn-host-start" class="menu-btn" style="display:none;" onclick="confirmHostRoomStart()">全員揃ったので開始</button>
 <button class="menu-btn gray" onclick="returnToTitle()">キャンセル</button>
 </div>

 <!-- ゲスト参加 -->
 <div id="screen-guest-join" class="overlay-screen">
 <h2>部屋コード入力</h2>
 <input type="number" id="input-room-code" class="text-input" placeholder="4桁の数字">
 <button class="menu-btn" onclick="joinRoom()">接続</button>
 <div id="status-message"></div>
 <button class="menu-btn gray" onclick="showScreen('screen-role-select')">戻る</button>
 </div>

 <!-- ゲスト待機 -->
 <div id="screen-guest-wait" class="overlay-screen">
 <h2>ホストの開始を待っています...</h2>
 <div class="player-list" id="guest-player-list"></div>
 </div>

 <!-- あみだくじ画面（3人以上） -->
 <div id="screen-amida" class="overlay-screen">
 <h2>順番決め（あみだくじ）</h2>
 <canvas id="amida-canvas" width="300" height="300"></canvas>
 <p id="amida-status" style="font-size: 14px; color: #ffcc00;"></p>
 <button id="btn-amida-start" class="menu-btn" style="display:none;" onclick="startAmidaDraw()">あみだくじスタート！</button>
 </div>

 <!-- おしつけ対象選択モーダル -->
 <div id="modal-target-select" class="modal-overlay">
 <h2>おしつけ相手を選択</h2>
 <div id="target-player-buttons" style="display:flex; flex-direction:column; gap:10px; width:80%; max-width:260px;"></div>
 </div>

 </div>

 <script src="script.js"></script>
</body>
</html>
