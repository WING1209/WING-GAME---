<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>パズルゲーム - お邪魔対戦</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background-color: #2b2b2b;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        h1, h2 {
            margin-bottom: 20px;
            color: #00ffcc;
            text-align: center;
        }
        .btn {
            background: #008cba;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 8px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 80%;
            max-width: 250px;
        }
        .btn:active {
            background: #005f73;
        }
        input, select {
            padding: 10px;
            margin: 8px;
            width: 80%;
            max-width: 250px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 16px;
            text-align: center;
        }
        #amida-canvas {
            background: #ffffff;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        #game-header {
            width: 100%;
            padding: 10px;
            background: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        #canvas-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: #000;
        }
        #action-bar {
            width: 100%;
            padding: 10px;
            background: #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .item-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
        }
        .item-btn:disabled {
            background: #555;
        }
        #player-list {
            width: 100%;
            margin-bottom: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- モード・人数選択画面 -->
    <div id="mode-screen" class="screen">
        <h1>パズル対戦</h1>
        <button class="btn" id="btn-single">1人プレイ</button>
        <button class="btn" id="btn-ojama-mode">お邪魔対戦</button>
        
        <div id="player-count-select" class="hidden">
            <h2>プレイ人数を選択</h2>
            <select id="select-players">
                <option value="2">2人</option>
                <option value="3">3人</option>
                <option value="4">4人</option>
                <option value="5">5人</option>
            </select>
            <button class="btn" id="btn-confirm-players">決定</button>
        </div>
    </div>

    <!-- プレイヤー名入力画面 -->
    <div id="name-input-screen" class="screen hidden">
        <h2>プレイヤー名入力</h2>
        <div id="name-inputs-container"></div>
        <button class="btn" id="btn-start-order">順番決めへ</button>
    </div>

    <!-- あみだくじ / じゃんけん 画面 -->
    <div id="order-screen" class="screen hidden">
        <h2 id="order-title">順番決め</h2>
        <canvas id="amida-canvas" width="300" height="300"></canvas>
        <div id="order-result" style="margin-bottom:10px; text-align:center;"></div>
        <button class="btn" id="btn-start-game">対戦開始！</button>
    </div>

    <!-- おしつけターゲット選択モーダル -->
    <div id="target-screen" class="screen hidden">
        <h2>おしつけ先を選択</h2>
        <div id="target-buttons"></div>
        <button class="btn" style="background:#777" id="btn-cancel-target">キャンセル</button>
    </div>

    <!-- メインゲーム画面 -->
    <div id="game-header">
        <div id="turn-info">手番: -</div>
        <div id="status-info">お邪魔蓄積: 0</div>
    </div>

    <div id="canvas-container">
        <canvas id="game-canvas" width="320" height="480"></canvas>
    </div>

    <div id="action-bar">
        <button id="btn-item-oshitsuke" class="item-btn" disabled>おしつけ (残り1個)</button>
        <button id="btn-end-turn" class="btn" style="width: auto; margin:0;">ターン終了</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
