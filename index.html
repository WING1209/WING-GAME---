<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WING GAME</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
* {
  box-sizing: border-box;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
body {
  margin: 0;
  padding: 0;
  background: #111;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  touch-action: none;
}
#game-container {
  position: relative;
  width: 100vw;
  height: 100dvh;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
canvas {
  background: #1a1a1a;
  box-shadow: 0 0 15px rgba(0,0,0,0.8);
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  z-index: 1;
  touch-action: none;
}
.overlay-screen {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(17, 17, 17, 0.95);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 100;
  text-align: center;
}
.overlay-screen h2 {
  color: #ffcc00;
  font-size: 24px;
  margin-bottom: 15px;
}
.menu-btn {
  background: #ff9800;
  color: #fff;
  border: none;
  padding: 12px 24px;
  font-size: 18px;
  font-weight: bold;
  border-radius: 25px;
  margin: 8px 0;
  width: 80%;
  max-width: 260px;
  cursor: pointer;
  box-shadow: 0 4px 6px rgba(0,0,0,0.3);
  touch-action: manipulation;
}
.menu-btn.sub {
  background: #2196f3;
}
.menu-btn.gray {
  background: #555;
}
.menu-btn:active {
  transform: scale(0.96);
}
input[type="text"], select {
  width: 80%;
  max-width: 260px;
  padding: 10px;
  font-size: 16px;
  border-radius: 8px;
  border: 1px solid #444;
  background: #222;
  color: #fff;
  margin-bottom: 15px;
  text-align: center;
}
/* 右側GUIパネル */
#right-gui-panel {
  position: absolute;
  right: 5px;
  top: 50px;
  width: 110px;
  background: rgba(0,0,0,0.6);
  border: 1px solid #444;
  border-radius: 8px;
  padding: 6px;
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.my-name-display {
  font-size: 14px;
  font-weight: bold;
  color: #ffcc00;
  text-align: center;
  border-bottom: 1px solid #555;
  padding-bottom: 4px;
}
.gui-item-btn {
  background: #333;
  color: #fff;
  border: 1px solid #666;
  border-radius: 6px;
  padding: 6px 4px;
  font-size: 11px;
  cursor: pointer;
  text-align: center;
}
.gui-item-btn.active {
  background: #4caf50;
  font-weight: bold;
}
.gui-item-btn.large {
  font-size: 13px;
  padding: 8px 4px;
  border: 2px solid #ff9800;
}
/* ルーレット・演出モーダル */
#center-modal {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.9);
  border: 2px solid #ffcc00;
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  z-index: 200;
  display: none;
  width: 80%;
  max-width: 300px;
}
#big-announce {
  position: absolute;
  top: 40%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 32px;
  font-weight: 900;
  color: #ffeb3b;
  text-shadow: 0 0 10px #ff5722;
  z-index: 300;
  display: none;
  pointer-events: none;
  text-align: center;
  width: 100%;
}
</style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas" width="400" height="660"></canvas>

  <!-- 右側GUIパネル -->
  <div id="right-gui-panel" style="display:none;">
    <div id="gui-my-name" class="my-name-display">PLAYER</div>
    <button class="gui-item-btn" id="btn-item-oshitsuke" onclick="useItemOshitsuke()">おしつけ</button>
    <button class="gui-item-btn" id="btn-item-hassha" onclick="useItemHassha()">発射</button>
    <button class="gui-item-btn" id="btn-item-bougyo" onclick="useItemBougyo()">防御</button>
  </div>

  <!-- タイトル画面 -->
  <div id="screen-title" class="overlay-screen" style="display:flex;">
    <h1 style="color:#ffcc00; font-size:32px; margin-bottom:30px;">WING★GAME</h1>
    <button class="menu-btn" onclick="selectMainMenu('host')">ホスト</button>
    <button class="menu-btn sub" onclick="selectMainMenu('guest')">ゲスト</button>
    <button class="menu-btn gray" onclick="selectMainMenu('exit')">終了</button>
  </div>

  <!-- ホスト設定：人数選択 -->
  <div id="screen-host-players" class="overlay-screen">
    <h2>対戦人数の選択</h2>
    <select id="select-player-count">
      <option value="2">2人対戦</option>
      <option value="3">3人対戦</option>
      <option value="4">4人対戦</option>
      <option value="5">5人対戦</option>
    </select>
    <button class="menu-btn" onclick="confirmPlayerCount()">次へ</button>
  </div>

  <!-- ホスト設定：ID・ゲームルール設定 -->
  <div id="screen-host-rules" class="overlay-screen">
    <h2>部屋設定</h2>
    <p>共有ID: <span id="display-room-id" style="font-size:22px; color:#4da6ff; font-weight:bold;">----</span></p>
    <label>勝利条件:</label>
    <select id="select-win-condition">
      <option value="1">1勝先取</option>
      <option value="2">2勝先取</option>
    </select>
    <label>お邪魔玉倍率:</label>
    <select id="select-ojama-rate">
      <option value="1">1倍 (標準)</option>
      <option value="2">2倍</option>
      <option value="3">3倍</option>
    </select>
    <button class="menu-btn" onclick="startHostWaiting()">待機部屋を開く</button>
  </div>

  <!-- ゲスト参加画面 -->
  <div id="screen-guest-join" class="overlay-screen">
    <h2>ID入力</h2>
    <input type="text" id="input-room-id" maxlength="4" placeholder="4桁のIDを入力">
    <button class="menu-btn" onclick="joinRoomByCode()">接続</button>
    <p id="guest-status-msg" style="color:#ff4d4d; font-size:14px;"></p>
  </div>

  <!-- 待機部屋 ＆ 名前入力 -->
  <div id="screen-lobby" class="overlay-screen">
    <h2>プレイヤー登録</h2>
    <p id="lobby-status">接続プレイヤーを待っています...</p>
    <input type="text" id="input-player-name" maxlength="6" placeholder="名前 (全角6文字以内)">
    <button class="menu-btn" id="btn-submit-name" onclick="submitPlayerName()">決定</button>
  </div>

  <!-- モーダル・演出用 -->
  <div id="center-modal">
    <h3 id="modal-title" style="color:#ffcc00; margin-top:0;">ルーレット</h3>
    <p id="modal-body" style="font-size:18px; margin:15px 0;"></p>
    <button class="menu-btn" id="modal-btn" onclick="handleModalClick()">タップ</button>
  </div>

  <!-- 画面中央ビッグアナウンス -->
  <div id="big-announce"></div>
</div>

<script src="script.js"></script>
</body>
</html>
