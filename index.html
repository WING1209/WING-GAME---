<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>パズルボブル風お邪魔対戦</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- タイトル画面 / メニュー -->
        <div id="menu-screen" class="screen">
            <h1>パズルボブル対戦</h1>
            <div class="menu-buttons">
                <button id="btn-single" class="btn">ひとりで遊ぶ</button>
                <button id="btn-friend" class="btn">フレンド対戦</button>
                <button id="btn-ranking" class="btn">ランキング</button>
                <button id="btn-custom" class="btn">画像カスタム</button>
            </div>
        </div>

        <!-- 何人で遊ぶか選択画面 -->
        <div id="player-count-screen" class="screen hidden">
            <h2>何人で遊ぶ？</h2>
            <div class="menu-buttons">
                <button class="btn btn-count" data-count="2">2人対戦</button>
                <button class="btn btn-count" data-count="3">3人対戦</button>
                <button class="btn btn-count" data-count="4">4人対戦</button>
                <button class="btn btn-count" data-count="5">5人対戦</button>
                <button class="btn btn-back" id="btn-count-back">もどる</button>
            </div>
        </div>

        <!-- ホスト/ゲスト選択画面 (2人の場合のみ、またはオンライン用) -->
        <div id="friend-mode-screen" class="screen hidden">
            <h2>フレンド対戦</h2>
            <div class="menu-buttons">
                <button id="btn-host" class="btn">部屋を作る (ホスト)</button>
                <button id="btn-join" class="btn">部屋に参加 (ゲスト)</button>
                <button class="btn btn-back" id="btn-friend-back">もどる</button>
            </div>
        </div>

        <!-- 対戦モード選択画面 (2人対戦時のみ) -->
        <div id="mode-select-screen" class="screen hidden">
            <h2>対戦モード選択</h2>
            <div class="menu-buttons">
                <button id="btn-mode-time" class="btn">タイムアタック</button>
                <button id="btn-mode-ojama" class="btn">お邪魔対戦</button>
                <button class="btn btn-back" id="btn-mode-back">もどる</button>
            </div>
        </div>

        <!-- 勝利ルール選択画面 (3人以上、またはお邪魔対戦) -->
        <div id="win-rule-screen" class="screen hidden">
            <h2>勝利ルールの選択</h2>
            <div class="menu-buttons">
                <button class="btn btn-win" data-wins="1">先に1勝</button>
                <button class="btn btn-win" data-wins="2">先に2勝</button>
                <button class="btn btn-back" id="btn-win-back">もどる</button>
            </div>
        </div>

        <!-- 名前入力画面 -->
        <div id="name-input-screen" class="screen hidden">
            <h2>プレイヤー名の入力</h2>
            <div class="input-group">
                <input type="text" id="player-name-input" placeholder="名前を入力" maxlength="10">
                <button id="btn-name-ok" class="btn">決定</button>
            </div>
            <button class="btn btn-back" id="btn-name-back">もどる</button>
        </div>

        <!-- 順番決め画面 (あみだくじ / じゃんけん) -->
        <div id="order-screen" class="screen hidden">
            <h2>順番決め</h2>
            <div id="order-content">
                <!-- じゃんけん or あみだくじ用エリア -->
            </div>
            <button id="btn-start-battle" class="btn hidden">対戦開始！</button>
        </div>

        <!-- 順番大画面表示用オーバーレイ -->
        <div id="turn-announce-overlay" class="hidden">
            <div id="turn-announce-text">1番手</div>
        </div>

        <!-- ゲームプレイ画面 -->
        <div id="game-screen" class="screen hidden">
            <div id="game-header">
                <span id="turn-info">自分のターン</span>
                <span id="score-info">スコア: 0</span>
                <button id="btn-pause" class="btn-small">一時停止</button>
            </div>
            <div id="play-area">
                <canvas id="game-canvas"></canvas>
            </div>
            <!-- 3人以上専用：おしつけアイテム用UI -->
            <div id="item-panel" class="hidden">
                <div class="item-title">おしつけアイテム (残りターン: <span id="item-turn-count">0</span>)</div>
                <div id="item-targets">
                    <!-- ターゲット選択用ボタンが動的に入る -->
                </div>
            </div>
            <div id="controls">
                <button id="btn-left" class="control-btn">◀</button>
                <button id="btn-shoot" class="control-btn">発射</button>
                <button id="btn-right" class="control-btn">▶</button>
            </div>
        </div>

        <!-- リザルト画面 -->
        <div id="result-screen" class="screen hidden">
            <h2 id="result-title">ゲーム終了</h2>
            <p id="result-text"></p>
            <button id="btn-restart" class="btn">メニューに戻る</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
