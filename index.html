<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>パズルゲーム - お邪魔対戦 (マルチ対応)</title>
    <!-- PeerJS CDN (WebRTC通信用) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 480px;
            height: 100vh;
            max-height: 800px;
            background-color: #2b2b2b;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10;
        }
        .hidden {
            display: none !important;
        }
        h1, h2 {
            margin-bottom: 20px;
            color: #00ffcc;
            text-align: center;
        }
        .btn {
            background: #008cba;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 8px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 80%;
            max-width: 250px;
        }
        .btn:active {
            background: #005f73;
        }
        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }
        input, select {
            padding: 10px;
            margin: 8px;
            width: 80%;
            max-width: 250px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 16px;
            text-align: center;
        }
        #amida-canvas {
            background: #ffffff;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        #game-header {
            width: 100%;
            padding: 10px;
            background: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        #canvas-container {
            position: relative;
            flex-grow: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background: #000;
        }
        #action-bar {
            width: 100%;
            padding: 10px;
            background: #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .item-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-weight: bold;
        }
        .item-btn:disabled {
            background: #555;
        }
        .room-info {
            background: #333;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            word-break: break-all;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- モード選択画面 -->
    <div id="mode-screen" class="screen">
        <h1>パズル対戦</h1>
        <button class="btn" id="btn-single">1人プレイ</button>
        <button class="btn" id="btn-create-room-menu">部屋を作る (ホスト)</button>
        <button class="btn" id="btn-join-room-menu">部屋に入る (ゲスト)</button>
    </div>

    <!-- 部屋作成設定画面 -->
    <div id="create-room-screen" class="screen hidden">
        <h2>部屋作成</h2>
        <label>自分の名前:</label>
        <input type="text" id="host-name-input" placeholder="名前を入力">
        <label>対戦人数:</label>
        <select id="select-max-players">
            <option value="2">2人</option>
            <option value="3">3人</option>
            <option value="4">4人</option>
            <option value="5">5人</option>
        </select>
        <button class="btn" id="btn-create-room">部屋を作成</button>
        <button class="btn" style="background:#666" id="btn-back-from-create">戻る</button>
    </div>

    <!-- 部屋参加画面 -->
    <div id="join-room-screen" class="screen hidden">
        <h2>部屋に参加</h2>
        <input type="text" id="guest-name-input" placeholder="自分の名前">
        <input type="text" id="join-room-id-input" placeholder="ルームIDを入力">
        <button class="btn" id="btn-join-room">参加</button>
        <button class="btn" style="background:#666" id="btn-back-from-join">戻る</button>
    </div>

    <!-- 待合室画面 -->
    <div id="lobby-screen" class="screen hidden">
        <h2>ロビー</h2>
        <div class="room-info">
            ルームID: <span id="display-room-id" style="color:#00ffcc; font-weight:bold;">-</span>
        </div>
        <div id="lobby-player-list" style="margin-bottom: 15px;"></div>
        <button class="btn" id="btn-start-order-setup" disabled>全員揃ったら順番決定へ</button>
    </div>

    <!-- あみだくじ / じゃんけん 画面 -->
    <div id="order-screen" class="screen hidden">
        <h2 id="order-title">順番決め</h2>
        <canvas id="amida-canvas" width="300" height="250"></canvas>
        <div id="order-result" style="margin-bottom:10px; text-align:center;"></div>
        <button class="btn hidden" id="btn-start-game">対戦開始！</button>
        <div id="waiting-host-msg" class="hidden" style="color:#aaa;">ホストが対戦を開始するのを待っています...</div>
    </div>

    <!-- おしつけターゲット選択モーダル -->
    <div id="target-screen" class="screen hidden">
        <h2>おしつけ先を選択</h2>
        <div id="target-buttons"></div>
        <button class="btn" style="background:#777" id="btn-cancel-target">キャンセル</button>
    </div>

    <!-- メインゲーム画面 -->
    <div id="game-header">
        <div id="turn-info">手番: -</div>
        <div id="status-info">お邪魔蓄積: 0</div>
    </div>

    <div id="canvas-container">
        <canvas id="game-canvas" width="320" height="480"></canvas>
    </div>

    <div id="action-bar">
        <button id="btn-item-oshitsuke" class="item-btn" disabled>おしつけ (残り1個)</button>
        <button id="btn-end-turn" class="btn" style="width: auto; margin:0;">ターン終了</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
